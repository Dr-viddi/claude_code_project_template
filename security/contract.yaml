# Agent contract - layer 1 of the runtime defense harness (security/adrian_init.py).
# Declarative policy the harness enforces. Reviewed like code. Secrets come from
# env vars, never inlined here.

version: 1
agent: production-agent

# control_mode: how verdicts are enforced.
#   audit            - observe + log only (default; safe to boot anywhere)
#   human_in_the_loop- pause risky actions for approval (raises ReviewRequired)
#   block            - reject risky actions outright (raises HarnessBlocked)
control_mode: audit

scope:
  allowed_tools: [crm, web_search, code_search]
  allowed_domains: ["example.com"]
  data_classes: [public, internal]

boundaries:
  forbidden_tools: [shell, filesystem_write]
  blocked_destinations: ["*.unknown-host.com"]
  max_usd_per_session: 2.00

pii:
  client_side_regex: [email, phone, national_id]
  server_side_llm_sweep: true

severity_tiers:
  bands: [low, medium, high, critical]
  action_threshold: high   # act on verdicts at this tier or above

alerts:
  min_severity: high
  channels:
    slack: "${SLACK_WEBHOOK_URL}"
    discord: "${DISCORD_WEBHOOK_URL}"
  payload: [verdict, reasoning, action]
