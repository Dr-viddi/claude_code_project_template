# pyproject.toml
#
# Intention:
#   Single source of truth for Python packaging, dependencies, and tool config
#   (ruff, black, mypy, pytest). Locking and reproducibility belong here.
#
# What this file should declare:
#   - [build-system]                  - setuptools or hatch / pdm / uv
#   - [project]                       - name, version, description, requires-python,
#                                       license, readme, runtime dependencies
#   - [project.optional-dependencies] - dev tooling (pytest, ruff, black, mypy)
#   - [tool.setuptools.packages.find] - which top-level packages to include
#   - [tool.ruff] / [tool.ruff.lint]  - line length 100, rule sets matching
#                                       `.claude/rules/code-style.md`
#   - [tool.black]                    - line length 100
#   - [tool.mypy]                     - strict = true
#   - [tool.pytest.ini_options]       - asyncio_mode, testpaths
#
# Example (commented; remove the leading '#' to activate):
#
# [build-system]
# requires = ["setuptools>=68", "wheel"]
# build-backend = "setuptools.build_meta"
#
# [project]
# name = "<project-name>"
# version = "0.1.0"
# description = "<one-liner>"
# requires-python = ">=3.11"
# readme = "README.md"
# license = {text = "MIT"}
# dependencies = [
#     "fastapi>=0.110",
#     "uvicorn[standard]>=0.29",
#     "pydantic>=2.6",
#     "pydantic-settings>=2.2",
#     "httpx>=0.27",
#     "redis>=5.0",
# ]
#
# [project.optional-dependencies]
# dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.4", "black>=24.0", "mypy>=1.10"]
#
# [tool.ruff]
# line-length = 100
# target-version = "py311"
#
# [tool.ruff.lint]
# select = ["E", "F", "I", "N", "B", "UP", "S", "SIM"]
# ignore = ["S101"]  # assert is fine in tests
#
# [tool.black]
# line-length = 100
# target-version = ["py311"]
#
# [tool.mypy]
# python_version = "3.11"
# strict = true
# ignore_missing_imports = true
#
# [tool.pytest.ini_options]
# asyncio_mode = "auto"
# testpaths = ["tests"]
