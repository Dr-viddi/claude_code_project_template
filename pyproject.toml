[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "production-agent"
version = "0.1.0"
description = "A runnable, production-shaped AI agent: routing, tools, memory, evals, observability, and a runtime defense harness. Wired for Claude Code."
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }

# Base runtime deps are deliberately light so the template runs offline with
# zero external services and no API key (see agent/llm.py EchoLLM). The heavier
# integrations are optional extras below.
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "black>=24.0",
    "mypy>=1.10",
    "types-PyYAML",
]
# Production integrations - install what you actually use:
#   redis    : real conversation window + semantic cache backend
#   anthropic: real LLM client (swap EchoLLM for AnthropicLLM in agent/llm.py)
#   langgraph: production agent state machine (the hand-rolled Agent is a stand-in)
redis = ["redis>=5.0"]
anthropic = ["anthropic>=0.39"]
langgraph = ["langgraph>=0.2"]

[project.scripts]
# `python -m app` style entry is via uvicorn; this is a convenience CLI for evals.
agent-eval = "evaluation.eval_runner:main"

[tool.setuptools.packages.find]
include = ["app*", "agent*", "memory*", "routing*", "security*", "evaluation*", "observability*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "B", "UP", "S", "SIM"]
# S101: asserts are fine in tests. S104: binding 0.0.0.0 is intentional in containers.
ignore = ["S104"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
# HarnessBlocked / ReviewRequired are control-flow signals, not errors - the
# *Error suffix (N818) would misrepresent them.
"security/harness.py" = ["N818"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
# Pragmatic strictness for a template: catch real bugs without ceremony.
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
