# .github/workflows/ci.yml
#
# Purpose
#   CI workflow. Runs the same quality gate locally and on every push / PR:
#   ruff, black --check, mypy, pytest, and the offline eval over the golden set.
#
# When you want a file like this
#   Any project shared with anyone else. Even a one-person project benefits
#   from a green badge that proves "main is healthy".
#
# Why it matters
#   - CI calls the SAME make targets developers do, so "passes locally, fails
#     in CI" failure modes are rare.
#   - The eval step gates merges on golden-set regression - the cheapest way to
#     enforce a quality bar.
#   - Coverage badge (if you add codecov upload) is a low-effort, high-signal
#     portfolio marker.
#
# What goes in it
#   - One job (`check`) running on ubuntu-latest.
#   - actions/checkout + actions/setup-python with cache.
#   - Install: `pip install -e ".[dev]"`.
#   - Steps: lint → format check → type check → test → eval.
#
# Example (commented; uncomment + edit)
#
