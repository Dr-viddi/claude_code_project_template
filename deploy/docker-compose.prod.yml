# deploy/docker-compose.prod.yml
#
# Purpose
#   Production overlay. Layered on top of docker-compose.yml to add the
#   hardening the dev stack omits: GPU access (if you run local models),
#   health checks, non-root containers, resource limits, restart policies, and
#   no source mounts.
#
#   Usage:
#     docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.prod.yml up -d
#
# When you want a file like this
#   The first time you deploy somewhere that isn't your laptop. Even a small
#   prod overlay forces you to think about secrets, restart policies, and
#   resource limits before they bite.
#
# Why it matters
#   - Read-only root + non-root user + dropped capabilities are the cheapest
#     and most impactful container hardening you can do.
#   - Resource limits prevent one process from starving its neighbours - the
#     #1 cause of "the whole node fell over" incidents.
#   - Pulling a pinned image (`!reset null` on `build`) means prod runs exactly
#     the artifact CI built, not a fresh local build.
#
# What it overrides (it does NOT repeat the base)
#   - `app`:
#       * Pinned image instead of `build`.
#       * `read_only: true` + tmpfs for scratch.
#       * Non-root user, dropped capabilities.
#       * `deploy.resources.limits` for cpu/memory.
#       * `restart: unless-stopped`.
#       * Healthcheck hitting /healthz (and /readyz).
#       * GPU reservation when running local models.
#   - `db` / `cache`: managed/persistent volumes, backups.
#   - Secrets via your orchestrator's secret store, not env files.
#
# Example (commented; uncomment + edit)
#
# services:
#   app:
#     image: ${REGISTRY}/${PROJECT}:${VERSION}
#     build: !reset null
#     read_only: true
#     tmpfs: ["/tmp"]
#     cap_drop: ["ALL"]
#     restart: unless-stopped
#     healthcheck:
#       test: ["CMD", "python", "-c",
#              "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz').status==200 else 1)"]
#       interval: 10s
#       timeout: 3s
#       retries: 5
#     deploy:
#       resources:
#         limits: { cpus: "2.0", memory: 2g }
#         # reservations:
#         #   devices:
#         #     - capabilities: ["gpu"]
