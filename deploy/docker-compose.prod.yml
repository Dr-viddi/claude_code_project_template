# Production overlay. Layered on top of docker-compose.yml:
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.prod.yml up -d
#
# Adds the hardening the dev stack omits. Pull a pinned image instead of building,
# run read-only + non-root, set resource limits, and add a health check.
services:
  app:
    image: ${REGISTRY:-localhost}/${PROJECT:-agent}:${VERSION:-latest}
    build: !reset null
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz').status==200 else 1)"
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2g
        # Uncomment to reserve a GPU for local model inference:
        # reservations:
        #   devices:
        #     - capabilities: ["gpu"]
