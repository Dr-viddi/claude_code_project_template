# Local development stack. From the repo root:
#   docker compose -f deploy/docker-compose.yml up --build
#
# The API runs offline by default (EchoLLM, in-memory stores, audit-mode harness),
# so db/cache are optional - uncomment them and set DATABASE_URL / REDIS_URL in .env
# when you wire real backends.
services:
  app:
    build:
      context: ..
      dockerfile: app/Dockerfile
    env_file:
      - path: ../.env
        required: false
    ports:
      - "8000:8000"
